version: "3.8"

services:
  vllm:
    image: vllm/vllm-openai:${VLLM_IMAGE_TAG:-latest}
    command: >
      --model ${MODEL_ID:-openai/gpt-oss-20b}
      --download-dir /models
      --host 0.0.0.0
      --port ${VLLM_PORT:-8000}
      --max-model-len ${MAX_MODEL_LEN:-131072}
      --gpu-memory-utilization ${GPU_MEMORY_UTILIZATION:-0.9}
      --tensor-parallel-size ${TENSOR_PARALLEL_SIZE:-1}
      ${QUANTIZATION:+--quantization ${QUANTIZATION}}
      --api-key ${VLLM_API_KEY}
      ${EXTRA_VLLM_FLAGS:-}
    environment:
      - HF_HUB_ENABLE_HF_TRANSFER=1
      - VLLM_WORKER_MULTIPROC_METHOD=spawn
      # Ajustes úteis de CUDA/torch (opcionais)
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-}
      - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:${MAX_SPLIT_SIZE_MB:-128}
    ports:
      - "${HOST_VLLM_PORT:-8000}:${VLLM_PORT:-8000}"
    volumes:
      - ./models:/models
    shm_size: "2g"
    gpus: ${GPUS:-all}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -s -H \"Authorization: Bearer ${VLLM_API_KEY}\" http://localhost:${VLLM_PORT:-8000}/v1/models >/dev/null || exit 1"]
      interval: 15s
      timeout: 7s
      retries: 40
      start_period: 25s

  webui:
    image: ghcr.io/open-webui/open-webui:main
    environment:
      - OPENAI_API_BASE_URL=http://vllm:${VLLM_PORT:-8000}/v1
      - OPENAI_API_KEY=${VLLM_API_KEY}
      - ENABLE_MODEL_SELECTOR=${ENABLE_MODEL_SELECTOR:-true}
      - WEBUI_AUTH=${WEBUI_AUTH:-true}
    ports:
      - "${HOST_WEBUI_PORT:-3000}:8080"
    depends_on:
      vllm:
        condition: service_healthy
    volumes:
      - webui:/app/backend/data
    restart: unless-stopped

volumes:
  webui:
